completion_models:
  default_completion_model:
    model_provider: azure
    model: gpt-4.1-mini
    azure_deployment_name: gpt-4.1-mini_Chosun_Test
    api_base: ${AZURE_OPENAI_ENDPOINT}
    api_version: 2025-01-01-preview
    auth_method: api_key
    api_key: ${AZURE_OPENAI_API_KEY}
    temperature: 0.0
    retry:
      type: exponential_backoff
embedding_models:
  default_embedding_model:
    model_provider: azure
    model: text-embedding-3-large
    azure_deployment_name: text-embedding-3-large
    api_base: ${AZURE_OPENAI_ENDPOINT}
    api_version: 2025-01-01-preview
    auth_method: api_key
    api_key: ${AZURE_OPENAI_API_KEY}
    retry:
      type: exponential_backoff
input:
  type: text
chunking:
  type: tokens
  size: 1200
  overlap: 200
  encoding_model: o200k_base
input_storage:
  type: file
  base_dir: input
output_storage:
  type: file
  base_dir: output
reporting:
  type: file
  base_dir: logs
cache:
  type: json
  storage:
    type: file
    base_dir: cache
vector_store:
  type: lancedb
  db_uri: output/lancedb
embed_text:
  embedding_model_id: default_embedding_model
extract_graph:
  completion_model_id: default_completion_model
  prompt: prompts/extract_graph_history_learning.txt
  entity_types:
  - 인물
  - 사건
  - 정책
  - 문물
  - 기관
  max_gleanings: 0
summarize_descriptions:
  completion_model_id: default_completion_model
  prompt: prompts/summarize_descriptions.txt
  max_length: 500
extract_graph_nlp:
  text_analyzer:
    extractor_type: regex_english
cluster_graph:
  max_cluster_size: 80
  use_lcc: false
extract_claims:
  enabled: false
  completion_model_id: default_completion_model
  prompt: prompts/extract_claims.txt
  description: Any claims or facts that could be relevant to information discovery.
  max_gleanings: 1
community_reports:
  completion_model_id: default_completion_model
  graph_prompt: prompts/community_report_graph_history_learning.txt
  text_prompt: prompts/community_report_text.txt
  max_length: 2000
  max_input_length: 8000
snapshots:
  graphml: false
  embeddings: false
local_search:
  completion_model_id: default_completion_model
  embedding_model_id: default_embedding_model
  prompt: prompts/local_search_system_prompt.txt
global_search:
  completion_model_id: default_completion_model
  map_prompt: prompts/global_search_map_system_prompt.txt
  reduce_prompt: prompts/global_search_reduce_system_prompt.txt
  knowledge_prompt: prompts/global_search_knowledge_system_prompt.txt
drift_search:
  completion_model_id: default_completion_model
  embedding_model_id: default_embedding_model
  prompt: prompts/drift_search_system_prompt.txt
  reduce_prompt: prompts/drift_search_reduce_prompt.txt
basic_search:
  completion_model_id: default_completion_model
  embedding_model_id: default_embedding_model
  prompt: prompts/basic_search_system_prompt.txt
