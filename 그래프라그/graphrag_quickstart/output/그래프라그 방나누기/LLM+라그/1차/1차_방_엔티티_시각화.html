하는 등 군사적 대응을 시도한 사건이다. 전쟁은 비교적 짧게 진행되었으며, 결국 조선과 후금 간에 화의가 체결되어 후금군이 철수함으로써 일단락되었다. 정묘호란은 이후 조선과 청나라 사이의 외교 관계에 큰 영향을 미쳐 두 나라 관계의 새로운 전환점을 마련하였다.", "aliases": []}, {"entity_id": 144, "title": "북벌 운동", "type": "사건", "visibility": "core", "reason": "호란 이후 대응 정책의 핵심입니다.", "frequency": 3, "degree": 4, "description": "북벌 운동은 조선 후기, 병자호란 이후 청나라에 대한 복수와 국토 회복을 목표로 추진된 군사적·정치적 운동이다. 이 운동은 특히 효종이 중심 인물로서 북벌을 국가 정책의 중요한 목표로 삼아 군사적 준비와 계획을 진행하였다. 북벌 운동은 조선이 청나라에 대한 군사적 복수를 이루기 위해 추진한 정책적 군사 운동으로, 조선 내에서 청에 대한 항쟁 의지를 상징하는 중요한 사례이다. 그러나 이러한 북벌 운동은 다양한 준비와 계획에도 불구하고 실제로 실행에 옮겨지거나 성공적으로 이루어지지는 못하였다. 결국 북벌 운동은 조선의 청나라에 대한 복수 의지를 반영하는 상징적인 운동이면서도 실질적인 성과를 내지 못한 군사적·정치적 시도로 평가된다.", "aliases": []}, {"entity_id": 174, "title": "효종", "type": "인물", "visibility": "core", "reason": "북벌 운동의 중심 군주입니다.", "frequency": 2, "degree": 2, "description": "효종은 조선 인조의 아들로, 병자호란 이후 민족적 수치를 씻기 위한 북벌 운동을 국가 정책으로 추진한 조선의 왕이다. 그는 송시열 등과 함께 군사력 증강에 힘쓰며 북벌을 준비하였지만, 실제로 북벌을 실행하지는 못했다. 효종의 통치는 병자호란이라는 위기 이후 국가의 재건과 국방 강화에 중점을 두었으며, 북벌 운동은 그의 주요 정책 중 하나로 자리 잡았다. 그러나 여러 현실적 제약과 외교적 요인으로 인해 북벌이 성사되지 못하면서 그의 북벌 정책은 미완에 그쳤다. 전반적으로 효종은 조선 후기 국방 강화와 민족적 자존 회복을 목표로 한 왕으로 평가받는다.", "aliases": []}, {"entity_id": 114, "title": "서인", "type": "기관", "visibility": "supporting", "reason": "인조반정과 친명 배금 정책의 주도 세력입니다.", "frequency": 4, "degree": 9, "description": "서인(西人)은 조선 중기와 후기 붕당 정치에서 중요한 역할을 한 정치 세력이다. 서인은 기존 기성 관료를 중심으로 형성된 보수적 성향의 정치 집단으로, 인조반정(1623년)을 주도하여 광해군을 축출하고 인조의 즉위를 가능하게 하였다. 이로 인해 서인은 인조반정 이후 집권 세력으로서 조선 정치사에 큰 영향을 미쳤다.\n\n서인은 집권 이후 친명(명나라 친선) 배금(청나라 배척) 정책을 실시하였으며, 이는 당시 조선의 대외 관계와 내부 정치에 중대한 방향성을 제시하였다. 1680년 이후에도 서인은 조선 후기 붕당 정치의 한 축으로 정치적 영향력을 계속 행사하였으며, 당시 붕당 정치의 이해에 필수적인 세력으로 평가받는다.\n\n요약하자면, 서인은 조선 중기부터 후기에 걸쳐 기존 관료 중심의 보수적 정치 집단으로서, 인조반정을 통해 권력을 장악하고 친명 배금 정책을 펼쳤으며, 이후에도 지속적으로 정치권에서 중요한 위치를 차지했던 대표적인 조선의 정치 세력이다.", "aliases": []}, {"entity_id": 142, "title": "친명 배금 정책", "type": "정책", "visibility": "supporting", "reason": "호란의 외교적 배경입니다.", "frequency": 2, "degree": 3, "description": "친명 배금 정책은 조선 시대 서인 정권 하에서 추진된 외교 정책으로, 명나라와 우호 관계를 유지하고 후금(나중의 청나라)를 배척하는 노선을 의미한다. 이 정책은 인조 때 특히 두드러졌으며, 명나라를 지지하는 동시에 후금에 적대적인 태도를 취함으로써 조선의 대외 관계와 국내 정치에 큰 영향을 미쳤다. 이러한 친명 배금 정책은 후금과의 갈등을 심화시켜 결국 두 차례에 걸친 병자호란을 초래하는 중요한 원인 중 하나로 평가된다. 요약하자면, 친명 배금 정책은 조선이 명나라와 긴밀한 유대를 유지하고 청나라를 배척하려는 외교적 방향성이었으며, 이는 국내외적으로 여러 역사적 사건과 변동에 결정적인 역할을 하였다.", "aliases": []}, {"entity_id": 140, "title": "중립 외교 정책", "type": "정책", "visibility": "supporting", "reason": "광해군 외교의 핵심입니다.", "frequency": 1, "degree": 1, "description": "광해군이 명과 후금 사이에서 균형을 유지하고 국외 정세 변동에 대응하기 위해 실행한 외교 정책이다.", "aliases": []}, {"entity_id": 173, "title": "광해군의 중립 외교", "type": "정책", "visibility": "supporting", "reason": "광해군 외교를 직접 설명합니다.", "frequency": 1, "degree": 2, "description": "광해군이 후금과의 충돌을 피하기 위해 실시한 외교 정책으로, 명과 후금 사이에서 중립을 유지하려 했다. 사림에게는 명에 대한 배신으로 여겨졌다.", "aliases": []}, {"entity_id": 141, "title": "인조", "type": "인물", "visibility": "supporting", "reason": "호란 시기 국왕으로서 중요합니다.", "frequency": 1, "degree": 1, "description": "인조는 조선 중기의 왕으로, 친명 배금 정책을 펴 두 차례의 호란을 겪었으며, 호란 이후 북벌 운동을 추진하였다.", "aliases": []}, {"entity_id": 168, "title": "후금", "type": "기관", "visibility": "supporting", "reason": "호란의 상대 세력입니다.", "frequency": 2, "degree": 3, "description": "후금은 17세기 초 여진족을 통일하여 1616년에 건국된 국가로, 만주 지역을 중심으로 형성되었다. 후금은 당시 동아시아 국제 질서에 중대한 변화를 일으키며 명나라와 대항하였다. 또한 후금은 조선을 압박하는 과정에서 정묘호란과 병자호란을 일으켜 국력을 과시했다. 점차 세력이 확장된 후 후금은 청으로 개칭되었으며, 이는 이후 동아시아 역사에 큰 영향을 미친 청나라의 전신이 되었다.", "aliases": []}, {"entity_id": 179, "title": "청", "type": "기관", "visibility": "supporting", "reason": "후금의 발전형으로 병자호란의 상대입니다.", "frequency": 1, "degree": 2, "description": "청은 후금이 발전하여 정식 국호를 선포한 국가로, 조선과의 전쟁(정묘호란, 병자호란)과 외교에서 상류 세력으로 부상하였다.", "aliases": []}, {"entity_id": 138, "title": "남한산성", "type": "기관", "visibility": "supporting", "reason": "병자호란 항전의 상징 공간입니다.", "frequency": 2, "degree": 2, "description": "남한산성은 조선 시대에 외적의 침략에 대비하여 임진왜란 이후 쌓은 산성으로, 국가 방어 체계의 핵심 시설이다. 이 산성은 군사적으로 중요한 요충지로서, 조선의 방어 전략에 중심적인 역할을 하였다. 특히 병자호란 당시에는 인조와 신하들이 이곳으로 피신하여 약 45일간 항전하며 조선의 항전 의             ${entities.map(e => `<div class="entity" onclick="this.classList.toggle('open')">
              <div class="entity-title"><b class="${e.visibility}">${e.title}</b><small>${e.type} · id=${e.entity_id} · ${e.visibility}</small></div>
              <div class="desc">${e.reason ? `<p><b>배치 이유</b>: ${e.reason}</p>` : ''}<p>${e.description || ''}</p>${(e.aliases || []).length ? `<p><b>alias</b>: ${e.aliases.join(', ')}</p>` : ''}</div>
            </div>`).join('')}
          </div>
        </div>
      </div>
    </article>`;
  }).join('');
  document.getElementById('rooms').innerHTML = rooms;
}
document.getElementById('search').addEventListener('input', render);
document.getElementById('visibility').addEventListener('change', render);
render();
</script>
</body>
</html>
