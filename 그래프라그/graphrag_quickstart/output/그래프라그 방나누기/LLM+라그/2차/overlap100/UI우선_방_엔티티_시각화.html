    * { box-sizing:border-box; }
    body { margin:0; font-family:Segoe UI, Pretendard, Arial, sans-serif; background:var(--bg); color:var(--ink); }

    input, select { border:1px solid var(--line); border-radius:6px; padding:9px 10px; font-size:14px; background:white; }
    main { padding:20px 28px 40px; }
    .summary { display:grid; grid-template-columns:repeat(auto-fit,minmax(180px,1fr)); gap:10px; margin-bottom:18px; }
    .metric { background:var(--panel); border:1px solid var(--line); border-radius:8px; padding:14px; }
    .metric strong { display:block; font-size:22px; margin-top:6px; }
    .room { background:var(--panel); border:1px solid var(--line); border-radius:8px; margin:14px 0; overflow:hidden; }
    .room-head { padding:16px; border-bottom:1px solid var(--line); display:flex; justify-content:space-between; gap:14px; align-items:flex-start; }
    .room-title { font-size:19px; font-weight:700; }
    .badges { display:flex; gap:6px; flex-wrap:wrap; justify-content:flex-end; }
    .badge { border-radius:999px; padding:4px 8px; font-size:12px; background:#eef2f7; color:#334155; }
    .core { color:var(--core); }
    .supporting { color:var(--support); }
    .search_only { color:var(--search); }
    .room-body { padding:16px; }
    .flow { color:var(--muted); margin-bottom:10px; }
    .grid { display:grid; grid-template-columns:1fr 1fr; gap:14px; }
    @media (max-width:900px) { .grid { grid-template-columns:1fr; } }
    h3 { font-size:15px; margin:16px 0 8px; }
    .subzone, .entity { border:1px solid var(--line); border-radius:6px; padding:10px; margin:8px 0; background:#fbfcfe; }
    .entity { cursor:pointer; }
    .entity-title { display:flex; justify-content:space-between; gap:10px; align-items:center; }
    .entity small { color:var(--muted); }
    .desc { display:none; color:#374151; margin-top:8px; line-height:1.45; font-size:13px; }
    .entity.open .desc { display:block; }
    .risk { color:var(--warn); font-size:13px; }
    .hidden { display:none !important; }
  </style>

n": "소론은 서인 붕당에서 노론과 함께 분화된 정치 세력으로, 노론과 대립하며 조선 후기에 정치적 입지를 유지하였다.", "aliases": []}, {"entity_id": 213, "title": "붕당 정치", "type": "臾몃Ъ", "visibility": "core", "reason": "방의 후반부를 대표하는 핵심 정치 구조입니다.", "frequency": 2, "degree": 7, "description": "붕당 정치는 조선 시대 초기부터 나타난 정치 형태로, 주로 사림 세력을 중심으로 형성된 서로 다른 학문적 경향과 지역 이익을 바탕으로 한 정치 세력 간의 경쟁과 견제를 의미한다. 특히 조선 후기에는 사림 세력이 공론을 중심으로 서로 견제하고 비판하면서 붕당 정치가 더욱 발전하였으며, 다양한 학문적 성향에 따라 여러 붕당이 형성되어 정치적 경쟁이 활발히 이루어졌다. 이러한 붕당 정치는 조선 후기의 정치 변화와 역동적인 권력 구조를 이해하는 데 중요한 역할을 하며, 동시에 조선 후기 사회와 문화 변동을 파악하는 데 있어서도 필수적인 정치적 흐름으로 평가된다.", "aliases": []}, {"entity_id": 214, "title": "탕평책", "type": "정책", "visibility": "core", "reason": "붕당 정치의 폐단을 조정하는 결론 축입니다.", "frequency": 5, "degree": 8, "description": "탕평책은 조선 후기 숙종, 영조, 정조 시기에 추진된 정치 조정 및 개혁 정책으로, 붕당 간의 심각한 대립과 갈등을 완화하고 왕권을 강화하여 국가의 안정을 도모하는 데 목적이 있었다. 숙종 때 처음 추진된 탕평책은 붕당 정치의 변질과 격렬한 대립으로 인한 정치 혼란을 조정하고 왕권을 공고히 하기 위한 정치 조정 정책이었다. 이후 영조와 정조 시기에는 붕당 간의 갈등과 편파를 완화하는 데 중점을 두어, 노론과 소론 등 다양한 붕당 인사들을 고르게 등용함으로써 정치적 균형을 유지하고 화합을 추구하였다. 이 정책은 붕당 정치의 폐단을 바로잡고 사회 안정을 도모하며, 경제 발전과 문물 제도 정비에도 기여함으로써 조선 후기 정치 변동과 개혁의 핵심적인 역할을 수행하였다. 결과적으로 탕평책은 조선 후기 정치적 불안을 완화하고 왕권을 강화하여 국가 전반의 안정과 발전에 중요한 밑거름이 된 정치적 화합 정책이었다.", "aliases": []}, {"entity_id": 215, "title": "영조", "type": "인물", "visibility": "supporting", "reason": "탕평책을 본격화한 군주로서 핵심 연결점입니다.", "frequency": 3, "degree": 7, "description": "영조는 조선 후기의 국왕으로, 붕당 정치의 폐단을 극복하고 사회 안정을 추구하기 위해 탕평책을 실시한 개혁 군주이다. 그는 탕평책을 통해 붕당 간 갈등을 완화하고 왕권을 강화하는 데 주력하였으며, 이를 바탕으로 정치적 안정을 도모하였다. 또한 영조는 사회 제도 개선과 민생 안정에도 기여하여 조선 후기 정치와 사회 변동을 이해하는 데 핵심적인 역할을 한 인물이다. 그의 통치는 조선 사회 전반의 변화를 이끌며 국가 체제의 안정과 발전에 중요한 영향을 끼쳤다.", "aliases": []}, {"entity_id": 197, "title": "송시열", "type": "인물", "visibility": "supporting", "reason": "노론과 북벌, 탕평기 정치의 대표 인물이라 보조 가치가 높습니다.", "frequency": 3, "degree": 3, "description": "송시열은 조선 후기의 대표적인 성리학자이자 정치가로, 서인 당파, 특히 노론의 핵심 인물이었다. 그는 효종부터 숙종 시기까지 활동하면서 붕당 정치와 탕평책 시대에 중대한 정치적·사상적 영향력을 행사하였다. 송시열은 효종과 함께 북벌 운동을 적극 지지하며 군사력 강화에 참여하였고, 이를 통해 국가의 안보를 강화하려는 노력을 기울였다. 그의 학문과 정치 활동은 조선 후기 서인의 중심축을 이루었으며, 당대의 정치적 갈등 속에서 중요한 역할을 담당하였다.", "aliases": []}, {"entity_id": 218, "title": "균역법", "type": "정책", "visibility": "search_only", "reason": "탕평기 개혁의 연장선으로 정치·사회 안정 흐름을 보강합니다. / supporting quality gate: weak learner-facing signal; preserved as search_only evidence", "frequency": 2, "degree": 1, "description": "균역법은 조선 후기인 1750년에 영조가 군역 부담을 줄이고자 시행한 군역제도 개혁 정책이다. 이 제도는 군사 동원의 공평성을 높이고 농민들의 부담을 완화하는 데 중점을 두어 국가 재정의 안정과 민생 안정을 도모하였다. 균역법은 군역과 관련된 비용을 보다 공평하게 분담하도록 하여 사회 전반의 안정에 기여하였으며, 이를 통해 국가 재정 개혁에도 중요한 역할을 하였다. 결과적으로 균역법은 조선 시대 농민들의 군사 의무 부담을 줄이고, 국가 재정 및 사회 체제의 효율성을 높인 주요한 정책으로 평가받는다.", "aliases": []}, {"entity_id": 250, "title": "서얼 차별 완화", "type": "정책", "visibility": "search_only", "reason": "사회 개혁의 세부 항목으로는 의미 있지만 방 제목과는 거리가 있습니다.", "frequency": 1, "degree": 1, "description": "서얼 차별 완화는 조선 후기 사회적 신분제의 불합리함을 줄이기 위해 시행된 제도로, 신분 갈등 완화와 사회 통합에 기여하였다.", "aliases": []}, {"entity_id": 232, "title": "비변사", "type": "기관", "visibility": "search_only", "reason": "후기 정치 기구로 중요하지만 붕당·탕평의 핵심 설명에는 부차적입니다.", "frequency": 1, "degree": 1, "description": "비변사는 임진왜란 이후 국방 문제 토의와 결정 권한이 확대되어 조선 후기 최고 정치 기구가 된 임시 정치·군사 기구이다.", "aliases": []}, {"entity_id": 18, "title": "인조반정", "type": "사건", "visibility": "supporting", "reason": "붕당 정치의 권력 재편을 보여주는 중요한 분기점입니다.", "frequency": 5, "degree": 5, "description": "인조반정은 1623년에 조선 중기에 발생한 정치적 사건으로, 서인 세력이 당시 왕이었던 광해군을 몰아내고 인조를 왕위에 올린 반란이다. 이 사건은 북인 정권을 몰아내고 서인이 권력을 장악하는 계기가 되었으며, 조선 중기의 정치 지형을 크게 변화시켰다. 인조반정은 광해군의 중립 외교 정책에 대한 사림과 서인 세력의 비판과 정치적 모략이 원인이 되었으며, 이를 통해 정권 교체와 국정 방향의 전환을 가져왔다. 특히, 인조반정 이후 서인 정권이 집권하면서 친명(친명나라) 배금(배척 명나라가 아닌 배척 여타 세력) 정책이 시작되었고, 이로 인해 조선의 대외 정책에도 중요한 변화가 일어났다. 전반적으로 인조반정은 조선 중기 권력 재편과 정치적 변화의 중요한 분기점으로 평가된다.", "aliases": []}, {"entity_id": 154, "title": "광해군", "type": "인물", "visibility": "supporting", "reason": "인조반정과 연결되는 정치 변동의 중심 인물입니다.", "frequency": 4, "degree": 4, "description": "광해군은 조선 중기의 왕으로, 임진왜란 이후 국정 정상화와 국방 강화에 힘쓰며 국제 정세 변화에 능동적으로 대응하였다. 특히 명과 후금 사이에서 중립 외교 정책을 추진하여 외침을 피하는 데 효과를 보였다. 이러한 중립 외교는 당시 조선이 처한 복잡한 국제 관계 속에서 안정과 평화를 유지하는 데 중요한 역할을 하였다. 그러나 그의 치세는 정치적 갈등과 도덕성에 관한 논란으로 얼룩졌으며, 결국 서인 세력이 주도한 인조반정으로 인해 왕위에서 물러나게 되었다. 광해군은 외교적 능력과 국방 강화에 기여한 반면, 내부 정책과 정치적 안정 면에서는 한계가 있었던 인물로 평가받는다.", "aliases": []}, {"entity_id": 155, "title": "중립 외교 정책", "type": "정책", "visibility": "supporting", "reason": "붕당 갈등이 외교 노선과 연결되는 지점을 설명합니다.", "frequency": 2, "degree": 2, "description": "중립 외교 정책은 조선 중기 광해군 시기에 시행된 외교 전략으로, 명나라와 후금(여진족 국가) 사이에서 균형을 유지하며 양국 간의 충돌을 피하고 외교적 긴장을 완화하는 데 중점을 둔 정책이다. 이 정책은 광해군이 국가 안보를 도모하고 조선의 안정된 외교 관계를 유지하기 위해 추진한 것으로, 당시 조선은 명과 후금 두 강대국 사이에서 신중하게 중립적인 입장을 취함으로써 어느 한쪽에 과도하게 치우치지 않고 양국과 우호적인 관계를 유지하고자 하였다. 중립 외교 정책은 조선이 국제 정세 속에서 자주성과 생존을 확보하려는 시도로 평가되며, 이를 통해 조선은 명과 후금 간의 세력 균형 속에서 외교적 긴장을 완화하고 국가의 평화와 안정에 기여하였다.", "aliases": []}, {"entity_id": 189, "title": "동의보감", "type": "문물", "visibility": "search_only", "reason": "중기 문화·의학 성과로는 중요하지만 정치사 방에서는 주변적입니다.", "frequency": 2, "degree": 3, "description": "『동의보감』은 조선 중기 허준이 편찬한 의학서로, 전통 약재를 사용한 예방 중심 치료법을 제시하여 동아시아 의학 발전에 크게 기여한 중요한 의학서이다. 이 책은 임진왜란과 그 이후의 전란 시기에 확산된 질병에 효과적으로 대응하는 데 큰 역할을 하였으며, 이로 인해 한국 의학사에서 중요한 위치를 차지한다. 『동의보감』은 조선시대 의학 지식을 체계적으로 정리하고 전통 의학의 효율적인 활용 방안을 제시함으로써 당시 사회의 보건 향상과 질병 예방에 중대한 영향을 끼쳤다.", "aliases": []}, {"entity_id": 190, "title": "허준", "type": "인물", "visibility": "search_only", "reason": "동의보감과 함께 검색 근거로만 두는 것이 적절합니다.", "frequency": 2, "degree": 1, "description": "허준은 조선 중기의 저명한 의학자로, 광해군 시기에 『동의보감』을 편찬하여 전통 약재를 활용한 예방 의학 중심의 치료법을 체계화하는 데 큰 역할을 했다. 그의 업적은 단순한 의학서 편찬을 넘어 한중일 삼국의 의학 발전에 지대한 영향을 미쳤으며, 조선 백성의 건강 증진에도 크게 기여하였다. 『동의보감』은 허준이 다양한 의학 지식과 경험을 종합하여 만든 의서로, 당시 의학의 체계화뿐만 아니라 실질적인 의료 현장에서 활용할 수 있는 예방 중심의 치료법을 담고 있다. 이를 통해 허준은 조선 의학의 수준을 한층 끌어올렸으며, 그의 저작은 이후 동아시아 전역에서 의학 연구와 실천에 중요한 기준으로 자리 잡았다.", "aliases": []}, {"entity_id": 191, "title": "강홍립", "type": "인물", "visibility": "search_only", "reason": "중립 외교의 사례이지만 핵심 정치 흐름보다 세부적입니다.", "frequency": 1, "degree": 1, "description": "강홍립은 광해군 때 파견된 장군으로, 후금과의 충돌을 피하고 조선의 중립 외교를 수행하기 위해 출병하였다.", "aliases"
