# Heavy backend (serve + orchestrator) deploy to Azure App Service.
# Modeled on the showcase workflow (main_3d-mindpalace-ai-backend.yml), same
# Python 3.13 pin and Deployment Center / Basic-auth publish-profile pattern.
#
# Manual trigger only (workflow_dispatch): the heavy backend keeps GraphRAG
# snapshots warm in RAM, so an auto-deploy on every push would restart and
# re-warm the server, which is unsafe to do unattended near a live demo. 윤재
# triggers this from the Actions tab when ready. To enable auto-deploy later,
# add the `push: branches: [main]` trigger back (see the commented block below).
#
# Before the first run, set in the heavy backend's GitHub repo settings:
#   - app-name below -> the App Service name 윤재 created for the heavy backend.
#   - secret AZUREAPPSERVICE_PUBLISHPROFILE_HEAVY_BACKEND -> that App Service's
#     publish profile (Deployment Center > Manage publish profile, or
#     az webapp deployment list-publishing-profiles --xml).
# The App Service "Startup Command" must be: bash startup.sh (see runbook).

name: Build and deploy heavy backend to Azure Web App

on:
  workflow_dispatch:
  # push:
  #   branches:
  #     - main

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read # required for actions/checkout

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python version
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      # Optional early build check (catches dependency resolution issues before
      # deploy). Oryx rebuilds on the platform anyway, so antenv/ is excluded from
      # the artifact. The heavy requirements (graphrag, spacy, onnxruntime) make
      # this slow; remove this step if deploy time matters more than early detection.
      - name: Create and start virtual environment and install dependencies
        run: |
          python -m venv antenv
          source antenv/bin/activate
          pip install -r requirements.txt

      - name: Upload artifact for deployment jobs
        uses: actions/upload-artifact@v4
        with:
          name: python-app
          path: |
            .
            !antenv/

  deploy:
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Download artifact from build job
        uses: actions/download-artifact@v4
        with:
          name: python-app

      - name: 'Deploy to Azure Web App'
        uses: azure/webapps-deploy@v3
        id: deploy-to-webapp
        with:
          app-name: '3D-mindpalace-heavy-backend'
          slot-name: 'Production'
          publish-profile: ${{ secrets.AZUREAPPSERVICE_PUBLISHPROFILE_HEAVY_BACKEND }}
