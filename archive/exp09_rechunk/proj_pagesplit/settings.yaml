### exp9 pagesplit rechunk — repro_run3 모델 설정 그대로, 청킹·입력만 다름.
### 차이점: input.type=json, 청크 분할 0(페이지당 1 unit), community_reports 워크플로 제외.

completion_models:
  default_completion_model:
    model_provider: azure
    model: gpt-4.1-mini
    azure_deployment_name: gpt-4.1-mini
    api_base: ${GRAPHRAG_API_BASE}
    api_version: 2024-12-01-preview
    auth_method: api_key
    api_key: ${GRAPHRAG_API_KEY}
    retry:
      type: exponential_backoff
    ### Azure 배포 RPM/TPM 모르니 보수적으로. 추출은 청크당 토큰 무거워 TPM이 실병목.
    rate_limit:
      type: sliding_window
      requests_per_period: 60
      tokens_per_period: 100000
      period_in_seconds: 60

embedding_models:
  default_embedding_model:
    model_provider: azure
    model: text-embedding-3-small
    azure_deployment_name: text-embedding-3-small
    api_base: ${GRAPHRAG_API_BASE}
    api_version: 2024-12-01-preview
    auth_method: api_key
    api_key: ${GRAPHRAG_API_KEY}
    retry:
      type: exponential_backoff

### 입력: 페이지 단위(pagesplit) 청크 50쪽 (page = 1 document)
input:
  type: json
  text_column: text
  file_pattern: ".*\\.json$$"
  encoding: utf-8

### 청킹: 문서 자르지 않게 size를 max(861) 훨씬 넘게, overlap 0
chunking:
  type: tokens
  size: 2000
  overlap: 0
  encoding_model: o200k_base

input_storage:
  type: file
  base_dir: "input"

output_storage:
  type: file
  base_dir: "../output/pagesplit_run1"

reporting:
  type: file
  base_dir: "../logs/pagesplit_run1"

cache:
  type: json
  storage:
    type: file
    base_dir: "../cache/pagesplit_run1"

vector_store:
  type: lancedb
  db_uri: "../output/pagesplit_run1/lancedb"
  ### graphrag_vectors의 DEFAULT_VECTOR_SIZE는 3072(text-embedding-3-large 기준)이라
  ### text-embedding-3-small(1536)과 mismatch → ArrowInvalid. 우리가 쓰는 임베딩만 명시.
  index_schema:
    entity_description:
      index_name: entity_description    # IndexSchema 기본 index_name이 'vector_index'이라 명시 안 하면 lancedb 테이블이 잘못된 이름으로 생성됨
      vector_size: 1536

### 워크플로 allowlist: Standard에서 create_community_reports만 제외
workflows:
  - load_input_documents
  - create_base_text_units
  - create_final_documents
  - extract_graph
  - finalize_graph
  - extract_covariates
  - create_communities
  - create_final_text_units
  - generate_text_embeddings

### 임베딩 타깃: 엔티티 설명만. report·text_unit 임베딩은 끔
embed_text:
  embedding_model_id: default_embedding_model
  names:
    - entity_description

extract_graph:
  completion_model_id: default_completion_model
  prompt: "../prompts/extract_graph.txt"
  entity_types: [인물, 사건, 정책, 문물, 서적, 기관, 장소]
  max_gleanings: 2

summarize_descriptions:
  completion_model_id: default_completion_model
  prompt: "../prompts/summarize_descriptions.txt"
  max_length: 500

extract_graph_nlp:
  text_analyzer:
    extractor_type: regex_english

cluster_graph:
  max_cluster_size: 15
  use_lcc: true

extract_claims:
  enabled: false
  completion_model_id: default_completion_model
  prompt: "../prompts/extract_claims.txt"
  description: "Any claims or facts that could be relevant to information discovery."
  max_gleanings: 1

community_reports:
  completion_model_id: default_completion_model
  graph_prompt: "../prompts/community_report_graph.txt"
  text_prompt: "../prompts/community_report_text.txt"
  max_length: 2000
  max_input_length: 8000

snapshots:
  graphml: false
  embeddings: false

### 검색 응답 속도 최적화 — 컨텍스트 토큰 및 엔티티 수 감소
concurrent_requests: 25

local_search:
  completion_model_id: default_completion_model
  embedding_model_id: default_embedding_model
  prompt: "../prompts/local_search_system_prompt.txt"
  max_context_tokens: 6000        # 기본 12000 → 프롬프트 크기 절반으로 단축
  top_k_entities: 5               # 기본 10 → 엔티티 수 감소
  top_k_relationships: 5          # 기본 10 → 관계 수 감소
  community_prop: 0.1             # 기본 0.15 → 커뮤니티 데이터 비율 소폭 감소
  conversation_history_max_turns: 2  # 기본 5 → 대화 기록 제한

global_search:
  completion_model_id: default_completion_model
  map_prompt: "../prompts/global_search_map_system_prompt.txt"
  reduce_prompt: "../prompts/global_search_reduce_system_prompt.txt"
  knowledge_prompt: "../prompts/global_search_knowledge_system_prompt.txt"
  data_max_tokens: 8000           # 기본 12000 → map 단계 입력 데이터 감소
  map_max_length: 500             # 기본 1000 → map 응답 길이 단축
  reduce_max_length: 1000         # 기본 2000 → 최종 답변 길이 제한

drift_search:
  completion_model_id: default_completion_model
  embedding_model_id: default_embedding_model
  prompt: "../prompts/drift_search_system_prompt.txt"
  reduce_prompt: "../prompts/drift_search_reduce_prompt.txt"

basic_search:
  completion_model_id: default_completion_model
  embedding_model_id: default_embedding_model
  prompt: "../prompts/basic_search_system_prompt.txt"
