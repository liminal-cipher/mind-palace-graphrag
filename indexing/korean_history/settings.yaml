### Indexing config for korean_history. Mirrors the historical repro_run3 build
### (root settings.yaml): same models/chunking/cluster, default (shared) prompts.
### Index-only config; runtime query config is the repo-root settings.yaml.

completion_models:
  default_completion_model:
    model_provider: azure
    model: gpt-4.1-mini
    azure_deployment_name: gpt-4.1-mini
    api_base: ${GRAPHRAG_API_BASE}
    api_version: 2024-12-01-preview
    auth_method: api_key
    api_key: ${GRAPHRAG_API_KEY}
    retry:
      type: exponential_backoff

embedding_models:
  default_embedding_model:
    model_provider: azure
    model: text-embedding-3-small
    azure_deployment_name: text-embedding-3-small
    api_base: ${GRAPHRAG_API_BASE}
    api_version: 2024-12-01-preview
    auth_method: api_key
    api_key: ${GRAPHRAG_API_KEY}
    retry:
      type: exponential_backoff

input:
  type: text
  file_pattern: '.*corpus.txt'  # 폴더의 다른 .txt(pagesplit 등)는 인덱싱 제외

chunking:
  type: tokens
  size: 1200
  overlap: 100
  encoding_model: o200k_base

input_storage:
  type: file
  base_dir: "../../input/korean_history"

output_storage:
  type: file
  base_dir: "../../output/korean_history"

reporting:
  type: file
  base_dir: "../../logs/korean_history"

cache:
  type: json
  storage:
    type: file
    base_dir: "../../cache/korean_history"

vector_store:
  type: lancedb
  db_uri: "../../output/korean_history/lancedb"
  vector_size: 1536

embed_text:
  embedding_model_id: default_embedding_model

extract_graph:
  completion_model_id: default_completion_model
  prompt: "prompts/extract_graph.txt"  # domain-tuned (this domain's own copy; shared prompts/ is neutral)
  entity_types: [인물, 사건, 정책, 문물, 서적, 기관, 장소]
  max_gleanings: 2

summarize_descriptions:
  completion_model_id: default_completion_model
  prompt: "prompts/summarize_descriptions.txt"  # domain-tuned
  max_length: 500

extract_graph_nlp:
  text_analyzer:
    extractor_type: regex_english

cluster_graph:
  max_cluster_size: 15
  use_lcc: true

extract_claims:
  enabled: false
  completion_model_id: default_completion_model
  prompt: "../../prompts/extract_claims.txt"
  description: "Any claims or facts that could be relevant to information discovery."
  max_gleanings: 1

community_reports:
  completion_model_id: default_completion_model
  graph_prompt: "prompts/community_report_graph.txt"  # domain-tuned
  text_prompt: "../../prompts/community_report_text.txt"  # shared neutral text prompt
  max_length: 2000
  max_input_length: 8000

snapshots:
  graphml: false
  embeddings: false

### Query settings (required by graphrag even for index-only roots) ###

local_search:
  completion_model_id: default_completion_model
  embedding_model_id: default_embedding_model
  prompt: "../../prompts/local_search_system_prompt.txt"

global_search:
  completion_model_id: default_completion_model
  map_prompt: "../../prompts/global_search_map_system_prompt.txt"
  reduce_prompt: "../../prompts/global_search_reduce_system_prompt.txt"
  knowledge_prompt: "../../prompts/global_search_knowledge_system_prompt.txt"

drift_search:
  completion_model_id: default_completion_model
  embedding_model_id: default_embedding_model
  prompt: "../../prompts/drift_search_system_prompt.txt"
  reduce_prompt: "../../prompts/drift_search_reduce_prompt.txt"

basic_search:
  completion_model_id: default_completion_model
  embedding_model_id: default_embedding_model
  prompt: "../../prompts/basic_search_system_prompt.txt"
