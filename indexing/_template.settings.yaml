### Indexing template. Copy to indexing/<domain>/settings.yaml for a new domain.
### Per-domain indexing config only (NOT the runtime query config: that is the
### repo-root settings.yaml, loaded by serve/warm_query). graphrag has no
### settings inheritance, so the models/chunking/cluster blocks are repeated
### verbatim here; change only the <domain> paths and the prompt locations.
###
### To add a domain:
###   1. copy this file to indexing/<domain>/settings.yaml
###   2. replace every <domain> with the domain id
###   3. shared prompts stay at ../../prompts/; for domain-tuned prompts run
###      `graphrag prompt-tune --domain "..."` into indexing/<domain>/prompts/
###      and point extract_graph/summarize/community_reports at prompts/<file>
###   4. graphrag index --root indexing/<domain>  ->  output/<domain>
###      then capture to snapshots/<domain>/

completion_models:
  default_completion_model:
    model_provider: azure
    model: gpt-4.1-mini
    azure_deployment_name: gpt-4.1-mini
    api_base: ${GRAPHRAG_API_BASE}
    api_version: 2024-12-01-preview
    auth_method: api_key
    api_key: ${GRAPHRAG_API_KEY}
    retry:
      type: exponential_backoff

embedding_models:
  default_embedding_model:
    model_provider: azure
    model: text-embedding-3-small
    azure_deployment_name: text-embedding-3-small
    api_base: ${GRAPHRAG_API_BASE}
    api_version: 2024-12-01-preview
    auth_method: api_key
    api_key: ${GRAPHRAG_API_KEY}
    retry:
      type: exponential_backoff

input:
  type: text

chunking:
  type: tokens
  size: 1200
  overlap: 100
  encoding_model: o200k_base

input_storage:
  type: file
  base_dir: "../../input/<domain>"

output_storage:
  type: file
  base_dir: "../../output/<domain>"

reporting:
  type: file
  base_dir: "../../logs/<domain>"

cache:
  type: json
  storage:
    type: file
    base_dir: "../../cache/<domain>"

vector_store:
  type: lancedb
  db_uri: "../../output/<domain>/lancedb"
  vector_size: 1536  # text-embedding-3-small; must match to avoid lancedb list_size error

embed_text:
  embedding_model_id: default_embedding_model

extract_graph:
  completion_model_id: default_completion_model
  prompt: "../../prompts/extract_graph.txt"  # shared default; swap to prompts/extract_graph.txt if tuned
  entity_types: [person, organization, event, location, concept]
  max_gleanings: 2

summarize_descriptions:
  completion_model_id: default_completion_model
  prompt: "../../prompts/summarize_descriptions.txt"
  max_length: 500

extract_graph_nlp:
  text_analyzer:
    extractor_type: regex_english

cluster_graph:
  max_cluster_size: 15
  use_lcc: true

extract_claims:
  enabled: false
  completion_model_id: default_completion_model
  prompt: "../../prompts/extract_claims.txt"
  description: "Any claims or facts that could be relevant to information discovery."
  max_gleanings: 1

community_reports:
  completion_model_id: default_completion_model
  graph_prompt: "../../prompts/community_report_graph.txt"  # shared default; swap to prompts/ if tuned
  text_prompt: "../../prompts/community_report_text.txt"
  max_length: 2000
  max_input_length: 8000

snapshots:
  graphml: false
  embeddings: false

### Query settings (required by graphrag even for index-only roots) ###

local_search:
  completion_model_id: default_completion_model
  embedding_model_id: default_embedding_model
  prompt: "../../prompts/local_search_system_prompt.txt"

global_search:
  completion_model_id: default_completion_model
  map_prompt: "../../prompts/global_search_map_system_prompt.txt"
  reduce_prompt: "../../prompts/global_search_reduce_system_prompt.txt"
  knowledge_prompt: "../../prompts/global_search_knowledge_system_prompt.txt"

drift_search:
  completion_model_id: default_completion_model
  embedding_model_id: default_embedding_model
  prompt: "../../prompts/drift_search_system_prompt.txt"
  reduce_prompt: "../../prompts/drift_search_reduce_prompt.txt"

basic_search:
  completion_model_id: default_completion_model
  embedding_model_id: default_embedding_model
  prompt: "../../prompts/basic_search_system_prompt.txt"
