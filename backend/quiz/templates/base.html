<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>GraphRAG Quiz</title>
  <style>
  :root { color-scheme: light dark; }
  body { font: 16px/1.6 system-ui, sans-serif; max-width: 760px; margin: 2rem auto; padding: 0 1rem; }
  h1 { font-size: 1.5rem; }
  form { display: grid; gap: .75rem; padding: 1rem; border: 1px solid #8884; border-radius: 10px; }
  form label { display: flex; gap: .5rem; align-items: center; }
  form input[type=text] { flex: 1; }
  input { padding: .4rem .5rem; border: 1px solid #8886; border-radius: 6px; }
  fieldset { display: flex; gap: 1rem; border: 0; padding: 0; }
  fieldset label { display: inline-flex; }
  button { padding: .55rem 1rem; border: 0; border-radius: 8px; background: #2563eb; color: #fff; cursor: pointer; font-size: 1rem; }
  .mode { font-weight: 600; }
  .mode.ok { color: #16a34a; }
  .mode.warn { color: #d97706; }
  .meta { color: #8889; font-size: .9rem; }
  .quiz { border: 1px solid #8884; border-radius: 10px; padding: 1rem; margin: 1rem 0; }
  .qhead { font-size: .8rem; color: #8889; display: flex; gap: .5rem; }
  .qtype { background: #8882; border-radius: 5px; padding: 0 .4rem; }
  .question { font-weight: 600; margin: .4rem 0; white-space: pre-wrap; }
  .choices { margin: .3rem 0; }
  .choices li.correct { font-weight: 700; }
  .opts { display: grid; gap: .35rem; margin: .4rem 0; }
  .opt { display: flex; gap: .5rem; align-items: center; cursor: pointer; }
  .ans { margin: .2rem 0; }
  .explain { margin: .3rem 0; }
  .score { font-size: 1.3rem; font-weight: 700; }
  .quiz.r-ok { border-color: #16a34a; }
  .quiz.r-no { border-color: #dc2626; }
  .ok { color: #16a34a; font-weight: 600; }
  .no { color: #dc2626; font-weight: 600; }
  details { margin-top: .5rem; }
  summary { cursor: pointer; color: #2563eb; }
  .src { color: #8889; font-size: .85rem; }
  a { color: #2563eb; }
  /* 근거 서랍(오른쪽 슬라이드) */
  .evi-tab { position: fixed; top: 50%; right: 0; transform: translateY(-50%);
    z-index: 20; border-radius: 8px 0 0 8px; padding: .8rem .35rem; font-size: 1.1rem;
    line-height: 1; transition: right .25s ease; }
  .evi-tab.open { right: min(380px, 85vw); }
  .evi-drawer { position: fixed; top: 0; right: 0; height: 100vh; width: min(380px, 85vw);
    background: Canvas; border-left: 1px solid #8884; box-shadow: -4px 0 16px #0003;
    transform: translateX(100%); transition: transform .25s ease; z-index: 19;
    display: flex; flex-direction: column; }
  .evi-drawer.open { transform: translateX(0); }
  .evi-head { padding: 1rem; border-bottom: 1px solid #8884; }
  .evi-head h2 { font-size: 1.1rem; margin: .2rem 0 0; }
  .eyebrow { color: #8889; font-size: .7rem; letter-spacing: .06em;
    text-transform: uppercase; margin: 0; }
  .evi-list { overflow: auto; padding: 1rem; display: grid; gap: .6rem; }
  .evi-card { border: 1px solid #8884; border-radius: 8px; padding: .7rem; }
  .evi-meta { display: flex; align-items: center; gap: .5rem; color: #8889; font-size: .75rem; }
  .evi-meta span { display: inline-grid; place-items: center; width: 22px; height: 22px;
    border-radius: 50%; background: #2563eb22; color: #2563eb; font-weight: 700; }
  .evi-card h3 { font-size: .95rem; margin: .3rem 0 0; line-height: 1.4; }
  .evi-topic { color: #8889; font-size: .8rem; margin: .3rem 0 0; }
  .evi-text { font-size: .82rem; margin: .4rem 0 0; line-height: 1.5; white-space: pre-wrap; }
  </style>
</head>
<body>
{% block body %}{% endblock %}
{% block script %}{% endblock %}
</body>
</html>
